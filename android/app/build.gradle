plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akahwaj.animeworld'
    compileSdk 34

    defaultConfig {
        applicationId "com.akahwaj.animeworld"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Hosted web app URL loaded by the bootstrap WebView.
        // To change the hosted endpoint, edit this single line:
        buildConfigField "String", "HOSTED_URL", '"https://akahwaj.github.io/NuvioWeb/"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
